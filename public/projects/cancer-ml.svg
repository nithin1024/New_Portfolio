      <text x="24" y="44" fill="#A0AEC0" font-family="Inter,Arial,sans-serif" font-size="15">Vision Transformer</text>
      <rect x="24" y="68" width="180" height="10" rx="5" fill="#A78BFA" opacity="0.8"/>
      <rect x="24" y="96" width="150" height="10" rx="5" fill="rgba(167,139,250,0.4)"/>
    </g>
    <g transform="translate(370,210)">
