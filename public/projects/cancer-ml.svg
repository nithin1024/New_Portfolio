<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Class Cancer Classification</title>
  <desc id="desc">Deep learning vision system with CNN, Vision Transformer, and confusion matrix</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120B1C"/>
      <stop offset="55%" stop-color="#140E1C"/>
      <stop offset="100%" stop-color="#0C0C0C"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <g transform="translate(110,110)">
    <rect width="980" height="530" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(167,139,250,0.3)" stroke-width="1.5"/>
