      <text x="28" y="48" fill="#A0AEC0" font-family="Inter,Arial,sans-serif" font-size="15">Confusion Matrix</text>
      <g transform="translate(80,80)">
        <rect width="70" height="70" rx="10" fill="rgba(52,211,153,0.55)"/>
        <rect x="86" width="70" height="70" rx="10" fill="rgba(255,255,255,0.08)"/>
        <rect x="172" width="70" height="70" rx="10" fill="rgba(255,255,255,0.06)"/>
        <rect x="258" width="70" height="70" rx="10" fill="rgba(249,115,22,0.25)"/>
        <rect y="86" width="70" height="70" rx="10" fill="rgba(255,255,255,0.08)"/>
        <rect x="86" y="86" width="70" height="70" rx="10" fill="rgba(52,211,153,0.45)"/>
        <rect x="172" y="86" width="70" height="70" rx="10" fill="rgba(255,255,255,0.07)"/>
        <rect x="258" y="86" width="70" height="70" rx="10" fill="rgba(255,255,255,0.05)"/>
