      <rect width="300" height="300" rx="22" fill="rgba(5,5,5,0.55)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="150" cy="140" r="70" fill="none" stroke="url(#violet)" stroke-width="3" opacity="0.9"/>
      <circle cx="150" cy="140" r="42" fill="rgba(167,139,250,0.15)" stroke="#A78BFA" stroke-width="2"/>
      <rect x="70" y="230" width="160" height="12" rx="6" fill="rgba(255,255,255,0.14)"/>
      <rect x="90" y="258" width="120" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
    </g>
    <g transform="translate(370,40)">
      <rect width="260" height="140" rx="18" fill="rgba(5,5,5,0.5)" stroke="rgba(255,255,255,0.08)"/>
      <text x="24" y="44" fill="#A0AEC0" font-family="Inter,Arial,sans-serif" font-size="15">CNN Branch</text>
      <rect x="24" y="68" width="180" height="10" rx="5" fill="#38BDF8" opacity="0.75"/>
      <rect x="24" y="96" width="140" height="10" rx="5" fill="rgba(56,189,248,0.4)"/>
    </g>
    <g transform="translate(660,40)">
